<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="bg-books" id="bgBooks" aria-hidden="true"></div>

    <div class="content">
        <div class="card-login">

            <div class="card-login-header">
                <a href="/REPRE-2.0/index.html" class="btn back">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Voltar
                </a>
                <div class="logo-bg">
                    <div class="logo-icon">
                        <img src="logo-ilustrativa.png" alt="Logo Repre">
                    </div>
                    <span class="logo-text">REPRE</span>
                </div>

                <h2 class="sub-text">Crie sua conta para acessar sua turma.</h2>
            </div>

            <form action="home.html" method="get" class="cadastro-form">
                <input class="form-input" type="text" name="name" placeholder="Nome Completo" required>
                <input class="form-input" type="email" name="email" placeholder="Email" required>
                <input class="form-input" type="password" name="password" placeholder="Senha" required>
                <button type="submit" class="btn btn-cadastrar">Cadastrar</button>
            </form>

        </div>
    </div>
    <footer>
        © 2025 Repre · Estude com organização
    </footer>

    <script src="funcaolivros.js"></script>
</body>

</html>
